services:
  elysium:
    image: boneappleteeth/elysium_dev:latest
    entrypoint: /usr/local/bin/parachain-template-node

    container_name: elysium-coin

    command:
      - --dev
      - --base-path
      - /data
      - --rpc-external
      - --rpc-cors
      - all

    ports:
      - "30333:30333"
      - "9933:9933"
      - "9944:9944"
      - "9615:9615"

    volumes:
      - elysium-data:/data

    restart: unless-stopped

volumes:
  elysium-data: