services:
  substrate-dev:
    image: docker.io/paritytech/ci-unified:latest
    network_mode: host
    tty: true
    stdin_open: true
    container_name: substrate-dev
    working_dir: /workspace
    entrypoint: []
    command: ["sleep", "infinity"]
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/workspace/target

volumes:
  cargo-registry:
  cargo-target: